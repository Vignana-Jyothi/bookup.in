map $http_x_forwarded_proto $calup_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

map $status $calup_asset_cache {
    default "no-store, max-age=0";
    200 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

server {
    listen 4242;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 12m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $calup_backend backend:5252;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $calup_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /health {
        proxy_pass http://$calup_backend$request_uri;
    }
    location = /api {
        proxy_pass http://$calup_backend$request_uri;
    }
    location ^~ /api/ {
        proxy_pass http://$calup_backend$request_uri;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control $calup_asset_cache always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /src/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(?:js|mjs|css|json|svg|png|jpg|jpeg|webp|ico|woff|woff2|map)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
