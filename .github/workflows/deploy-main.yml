name: Deploy Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: college-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validate
    if: github.repository == 'Vignana-Jyothi/bookup.in' && github.ref == 'refs/heads/main'
    runs-on: gamma
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and write separate build/runtime settings
        run: node backend/scripts/college-env.mjs --from-env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || vars.VITE_APP_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL || vars.VITE_SUPPORT_EMAIL }}
          VITE_DEMO_SLUG: ${{ secrets.VITE_DEMO_SLUG || vars.VITE_DEMO_SLUG }}
          VITE_CASHFREE_V1_ENABLED: ${{ secrets.VITE_CASHFREE_V1_ENABLED || vars.VITE_CASHFREE_V1_ENABLED }}
          VITE_LEGAL_NAME: ${{ secrets.VITE_LEGAL_NAME || vars.VITE_LEGAL_NAME }}
          VITE_BUSINESS_ADDRESS: ${{ secrets.VITE_BUSINESS_ADDRESS || vars.VITE_BUSINESS_ADDRESS }}
          VITE_GRIEVANCE_CONTACT_NAME: ${{ secrets.VITE_GRIEVANCE_CONTACT_NAME || vars.VITE_GRIEVANCE_CONTACT_NAME }}
          VITE_GRIEVANCE_EMAIL: ${{ secrets.VITE_GRIEVANCE_EMAIL || vars.VITE_GRIEVANCE_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY || vars.TOKEN_ENCRYPTION_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || vars.FRONTEND_URL }}
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL || vars.BACKEND_PUBLIC_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || vars.CORS_ORIGIN }}
          TRUST_PROXY: ${{ secrets.TRUST_PROXY || vars.TRUST_PROXY }}
          BACKGROUND_WORKERS_ENABLED: ${{ secrets.BACKGROUND_WORKERS_ENABLED || vars.BACKGROUND_WORKERS_ENABLED }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI || vars.GOOGLE_REDIRECT_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || vars.RESEND_FROM_EMAIL }}
          TWO_FACTOR_API_KEY: ${{ secrets.TWO_FACTOR_API_KEY || vars.TWO_FACTOR_API_KEY }}
          TWO_FACTOR_TEMPLATE_NAME: ${{ secrets.TWO_FACTOR_TEMPLATE_NAME || vars.TWO_FACTOR_TEMPLATE_NAME }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL || vars.SUPPORT_EMAIL }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN || vars.APP_DOMAIN }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET || vars.INTERNAL_CRON_SECRET }}
          RICH_AUTOMATE_API_KEY: ${{ secrets.RICH_AUTOMATE_API_KEY || vars.RICH_AUTOMATE_API_KEY }}
          RICH_AUTOMATE_TEMPLATE_CONFIRMATION_CUSTOMER: ${{ secrets.RICH_AUTOMATE_TEMPLATE_CONFIRMATION_CUSTOMER || vars.RICH_AUTOMATE_TEMPLATE_CONFIRMATION_CUSTOMER }}
          RICH_AUTOMATE_TEMPLATE_CONFIRMATION_PROVIDER: ${{ secrets.RICH_AUTOMATE_TEMPLATE_CONFIRMATION_PROVIDER || vars.RICH_AUTOMATE_TEMPLATE_CONFIRMATION_PROVIDER }}
          RICH_AUTOMATE_TEMPLATE_REMINDER_CUSTOMER: ${{ secrets.RICH_AUTOMATE_TEMPLATE_REMINDER_CUSTOMER || vars.RICH_AUTOMATE_TEMPLATE_REMINDER_CUSTOMER }}
          WHATSAPP_MEETING_ENABLED: ${{ secrets.WHATSAPP_MEETING_ENABLED || vars.WHATSAPP_MEETING_ENABLED }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN || vars.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID || vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_MEETING_TEMPLATE: ${{ secrets.WHATSAPP_MEETING_TEMPLATE || vars.WHATSAPP_MEETING_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE || vars.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_GRAPH_API_VERSION: ${{ secrets.WHATSAPP_GRAPH_API_VERSION || vars.WHATSAPP_GRAPH_API_VERSION }}
          CASHFREE_V1_ENABLED: ${{ secrets.CASHFREE_V1_ENABLED || vars.CASHFREE_V1_ENABLED }}
          CASHFREE_ENVIRONMENT: ${{ secrets.CASHFREE_ENVIRONMENT || vars.CASHFREE_ENVIRONMENT }}
          CASHFREE_ADMIN_REFUNDS_ENABLED: ${{ secrets.CASHFREE_ADMIN_REFUNDS_ENABLED || vars.CASHFREE_ADMIN_REFUNDS_ENABLED }}
          CASHFREE_CLIENT_ID: ${{ secrets.CASHFREE_CLIENT_ID || vars.CASHFREE_CLIENT_ID }}
          CASHFREE_CLIENT_SECRET: ${{ secrets.CASHFREE_CLIENT_SECRET || vars.CASHFREE_CLIENT_SECRET }}
          CASHFREE_API_VERSION: ${{ secrets.CASHFREE_API_VERSION || vars.CASHFREE_API_VERSION }}
          CASHFREE_SANDBOX_ALLOW_UNVERIFIED_CONTACT: ${{ secrets.CASHFREE_SANDBOX_ALLOW_UNVERIFIED_CONTACT || vars.CASHFREE_SANDBOX_ALLOW_UNVERIFIED_CONTACT }}
          CASHFREE_MARKETPLACE_ENABLED: ${{ secrets.CASHFREE_MARKETPLACE_ENABLED || vars.CASHFREE_MARKETPLACE_ENABLED }}
          CASHFREE_MARKETPLACE_CLIENT_ID: ${{ secrets.CASHFREE_MARKETPLACE_CLIENT_ID || vars.CASHFREE_MARKETPLACE_CLIENT_ID }}
          CASHFREE_MARKETPLACE_CLIENT_SECRET: ${{ secrets.CASHFREE_MARKETPLACE_CLIENT_SECRET || vars.CASHFREE_MARKETPLACE_CLIENT_SECRET }}
          CASHFREE_CUSTOMER_MEMBERSHIPS_ENABLED: ${{ secrets.CASHFREE_CUSTOMER_MEMBERSHIPS_ENABLED || vars.CASHFREE_CUSTOMER_MEMBERSHIPS_ENABLED }}
          CASHFREE_CUSTOMER_MEMBERSHIPS_CLIENT_ID: ${{ secrets.CASHFREE_CUSTOMER_MEMBERSHIPS_CLIENT_ID || vars.CASHFREE_CUSTOMER_MEMBERSHIPS_CLIENT_ID }}
          CASHFREE_CUSTOMER_MEMBERSHIPS_CLIENT_SECRET: ${{ secrets.CASHFREE_CUSTOMER_MEMBERSHIPS_CLIENT_SECRET || vars.CASHFREE_CUSTOMER_MEMBERSHIPS_CLIENT_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      - name: Build, deploy, verify and restore previous images on failure
        run: bash backend/scripts/college-deploy.sh
